{% extends "datasets/base.html" %}{% load i18n %}
{% block dataset_content %}
<section class="card max-w-2xl"><div class="alert alert-error"><strong>{% translate "Permanent deletion" %}</strong><p class="mt-1">{% translate "This removes all DatasetVersion metadata and private source artifacts. This cannot be undone." %}</p></div><form method="post" class="mt-5 space-y-4" novalidate>{% csrf_token %}<label class="field" for="{{ form.confirmation.id_for_label }}"><span class="label">{{ form.confirmation.label }}</span><span class="help-text">{% blocktranslate with name=dataset.name %}Enter exactly: {{ name }}{% endblocktranslate %}</span>{{ form.confirmation }}{% if form.confirmation.errors %}<span role="alert">{{ form.confirmation.errors|striptags }}</span>{% endif %}</label><div class="toolbar"><button class="btn btn-danger" type="submit">{% translate "Permanently delete dataset" %}</button><a class="btn btn-secondary" href="{% url 'datasets:settings' workspace.slug project.id project.slug dataset.id dataset.slug %}">{% translate "Cancel" %}</a></div></form></section>
{% endblock %}
