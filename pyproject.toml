[project]
name = "agencitystudio"
version = "0.4.0"
description = "Web interface and orchestration layer for AgencityLab"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "agencitylab==1.1.3",
    "celery[redis]>=5.5,<6",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.35",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.12",
    "pre-commit>=4",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["accounts*", "common*", "config*", "labbridge*", "projects*", "workspaces*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["accounts", "common", "config", "labbridge", "projects", "workspaces"]

[tool.ruff.lint.per-file-ignores]
"accounts/forms.py" = ["RUF012"]
"accounts/migrations/*.py" = ["RUF012"]
"accounts/models.py" = ["RUF012"]
"config/settings/*.py" = ["F403", "F405"]
"projects/forms.py" = ["RUF012"]
"projects/migrations/*.py" = ["RUF012"]
"projects/models.py" = ["RUF012"]
"workspaces/migrations/*.py" = ["RUF012"]
"workspaces/models.py" = ["RUF012"]
