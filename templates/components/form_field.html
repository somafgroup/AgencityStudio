<div class="field"><label class="label" for="{{ id }}">{{ label }}{% if required %} <span aria-hidden="true">*</span><span class="sr-only"> required</span>{% endif %}</label>{% if description %}<p id="{{ id }}-help" class="help-text">{{ description }}</p>{% endif %}{% if error %}<p id="{{ id }}-error" class="validation-error" role="alert">{{ error }}</p>{% endif %}</div>
