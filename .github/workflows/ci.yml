name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agencitystudio
          POSTGRES_USER: agencitystudio
          POSTGRES_PASSWORD: agencitystudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencitystudio -d agencitystudio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: agencitystudio
      POSTGRES_USER: agencitystudio
      POSTGRES_PASSWORD: agencitystudio
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DATASET_STORAGE_ROOT: ${{ github.workspace }}/storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -e . pytest pytest-django ruff
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend build
        run: npm run build
      - name: Python quality
        run: ruff check accounts analyses config common datasets labbridge projects sensitivity systems workspaces tests
      - name: Compile Python
        run: python -m compileall accounts analyses config common datasets labbridge projects sensitivity systems workspaces tests
      - name: Django checks
        run: python manage.py check
      - name: Production Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-django-deploy-check-key-2026-not-a-production-secret-8f2a7c91
          DJANGO_ALLOWED_HOSTS: studio.example.test
          DJANGO_SECURE_HSTS_SECONDS: 31536000
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_SECURE_HSTS_PRELOAD: 'true'
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
      - name: Database migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply database migrations
        run: python manage.py migrate --noinput
      - name: Backend tests on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: pytest
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start worker and application
        run: |
          rm -rf .emails storage
          mkdir -p .emails storage
          celery -A config worker --loglevel=WARNING --concurrency=1 > /tmp/agencitystudio-worker.log 2>&1 &
          uvicorn config.asgi:application --host 127.0.0.1 --port 8000 > /tmp/agencitystudio.log 2>&1 &
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8000/health/ready/ && exit 0; sleep 1; done
          cat /tmp/agencitystudio.log
          cat /tmp/agencitystudio-worker.log
          exit 1
      - name: Playwright smoke
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: application
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Build application images
        run: docker compose build web worker
      - name: Start infrastructure
        run: docker compose up -d postgres redis
      - name: Apply migrations in container
        run: docker compose run --rm web python manage.py migrate --noinput
      - name: Start web and worker
        run: docker compose up -d web worker
      - name: Verify container readiness
        run: |
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8000/health/ready/ && exit 0; sleep 2; done
          docker compose ps
          docker compose logs web worker
          exit 1
      - name: Verify worker execution
        run: docker compose exec -T web python -c "from config import celery_app; result = celery_app.send_task('common.health_ping'); assert result.get(timeout=10) == 'pong'"
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
