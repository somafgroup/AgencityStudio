name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agencitystudio
          POSTGRES_USER: agencitystudio
          POSTGRES_PASSWORD: agencitystudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: agencitystudio
      POSTGRES_USER: agencitystudio
      POSTGRES_PASSWORD: agencitystudio
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e . pytest pytest-django

      - name: Compile Python
        run: python -m compileall .

      - name: Django checks
        run: python manage.py check

      - name: Database migrations check
        run: python manage.py migrate --noinput

      - name: Backend tests
        run: pytest

      - name: Install Node dependencies for smoke test
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Start application
        run: |
          uvicorn config.asgi:application --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Playwright smoke test
        run: npx playwright test
