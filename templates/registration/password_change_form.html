{% extends "base.html" %}{% load i18n %}
{% block content %}
<header class="page-header"><div><p class="muted mb-1 text-sm">{% translate "Account" %}</p><h1 class="page-title">{% translate "Change password" %}</h1></div></header>
<section class="card max-w-2xl">
  <form method="post" class="space-y-5">
    {% csrf_token %}
    {% include "components/form_fields.html" %}
    <div class="toolbar"><button class="btn btn-primary" type="submit">{% translate "Update password" %}</button><a class="btn btn-secondary" href="{% url 'accounts:profile' %}">{% translate "Cancel" %}</a></div>
  </form>
</section>
{% endblock %}
