{% extends "auth_base.html" %}{% load i18n %}
{% block content %}
<h1 class="text-xl font-semibold">{% translate "Reset password" %}</h1>
<p class="muted mt-1 text-sm">{% translate "Enter your account email and we will send a secure reset link." %}</p>
<form method="post" class="mt-6 space-y-5">
  {% csrf_token %}
  {% include "components/form_fields.html" %}
  <button class="btn btn-primary w-full" type="submit">{% translate "Send reset link" %}</button>
</form>
<p class="muted mt-5 text-sm"><a href="{% url 'accounts:login' %}">{% translate "Back to sign in" %}</a></p>
{% endblock %}
